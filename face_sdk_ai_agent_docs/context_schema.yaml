  # ██ ContextTemplate ███████████████████████████████████████████████████
  ContextTemplate:
    description: "Binary biometric face template. NATIVE SDK OBJECT — cannot be manually constructed as a dict/struct. Obtain only via: (1) FACE_TEMPLATE_EXTRACTOR → objects[].face_template.template, (2) FacerecService.loadContextTemplate(stream)."
    preferred_creation:
      - method: "extract from pipeline"
        description: "Run FACE_TEMPLATE_EXTRACTOR on processed Context, read objects[].face_template.template"
      - method: "FacerecService.loadContextTemplate"
        input: "binary stream (istream / BinaryIO / InputStream / Stream)"
        use_case: "deserialize previously saved template"
    methods:
      getMethodName:
        returns: string
        description: Template modification name (e.g., "1000")
      size:
        returns: int
        description: Template size in bytes
      save:
        parameters:
          - stream: binary output stream
        description: Save to binary stream
      dispose:
        description: "Explicit cleanup. Optional in Java (has finalizer). REQUIRED in Flutter. Optional in C#. Not needed in C++/Python."

  # ██ DynamicTemplateIndex ██████████████████████████████████████████████
  DynamicTemplateIndex:
    description: Dynamic template database for 1:N search
    confidence: explicit
    config:
      modification:
        type: string
        default: "1000"
        description: Template modification — must match FACE_TEMPLATE_EXTRACTOR
      version:
        type: long
        default: 1
        description: Modification version
      max_license_count:
        type: long
        default: 100
        description: ⚠️ Max templates. Default=100 — increase for production use (exception if exceeded)
      capacity:
        type: long
        default: max_license_count
        description: Reserved space for templates
      force_unique_uuids:
        type: bool
        default: true
        description: Enforce UUID uniqueness
      async:
        type: bool
        default: false
        description: Async add/remove (beta feature)
      templates_path:
        type: string
        required: false
        description: Path to previously saved index file for loading (via save())
    methods:
      add:
        parameters:
          - template: ContextTemplate or array
          - uuid: string or array
        description: Add single or multiple templates with UUIDs
        throws: exception on duplicate UUID or capacity exceeded
      remove:
        parameters:
          - uuid: string or array
        description: Remove single or multiple templates by UUIDs
        throws: exception on non-existent UUID
      size:
        returns: int
        description: Number of stored templates
      capacity:
        returns: long
        description: Maximum capacity
      getUUID:
        parameters:
          - index: long
        returns: string
        description: Get UUID by position index
      at:
        parameters:
          - uuid: string
        returns: ContextTemplate
        description: Get template by UUID
      concat:
        parameters:
          - other: DynamicTemplateIndex
        description: Merge another index (invalidates source)
      save:
        parameters:
          - path: string
          - allowOverwrite: bool
        description: Save index to file
        throws: exception on I/O errors
      clear:
        description: Clear all templates
      get:
        parameters:
          - index: long
        returns: ContextTemplate
        description: "Get template by numeric index. Available in all language APIs. Java uses long parameter type (index), Python uses int."
      getMethodName:
        returns: string
        description: "Returns the modification name this index was created with (e.g. '1000'). Use to verify match with FACE_TEMPLATE_EXTRACTOR modification."
      dispose:
        description: "Explicit cleanup. Optional in Java (has finalizer). REQUIRED in Flutter. Optional in C# (has finalizer). Not needed in C++/Python."
