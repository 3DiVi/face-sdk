unit_type: QUALITY_CONTROL
description: Reduces recognition/liveness errors by filtering low-quality faces
confidence: explicit
gpu_supported: true
modifications:
- name: core
  description: Pass/fail verdict with configurable quality checks (default). CPU-only modification — no GPU support.
  versions:
  - version: 1
    parameters:
      mode:
        type: array
        required: false
        default: ["recognition"]
        description: Operating mode(s). One or both of "recognition", "liveness". Pass as array e.g. ["recognition", "liveness"]
      preset:
        type: enum
        required: false
        default: optimal
        description: Quality preset. Determines threshold strictness for all checks
        enum:
          - minimal
          - optimal
          - maximum
      face_overflow_extended:
        type: bool
        required: false
        default: true
        description: Use extended face overflow check algorithm (default true). Set false for backward compatibility with v3.28.0
- name: estimation
  description: Neural network-based quality score. Outputs quality.value (bool, threshold check) and quality.confidence (double 0-1)
  versions:
  - version: 1
requires:
- image
- objects[].bbox
- objects[].keypoints
produces:
- objects[].quality
prerequisites:
- FACE_DETECTOR
- FACE_TRACKING_MODULE
- FACE_FITTER
prerequisites_note: "OR: requires either FACE_DETECTOR or FACE_TRACKING_MODULE (not both)"
constraints:
  multiple_faces_supported: true
errors:
  - code: 0x18ba1f8e
    description: Unknown modification specified in block config
  - code: 0x032ad038
    description: onnxruntime library could not be loaded
see_also:
  api:
    - languages/python_api.yaml
    - languages/cpp_api.yaml
    - languages/java_api.yaml
    - languages/csharp_api.yaml
    - languages/flutter_api.yaml
