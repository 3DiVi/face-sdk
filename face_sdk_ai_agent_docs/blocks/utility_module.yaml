unit_type: UTILITY_MODULE
description: Utility block for face normalization and cropping. Output face_crop is in RGB format.
confidence: explicit
gpu_supported: false
modifications:
- name: face_cut
  description: Face normalization and cropping utility. Output is always RGB.
  versions:
  - version: 1
    parameters:
      cut_type:
        type: enum
        required: false
        default: FACE_CUT_FULL_FRONTAL
        description: Crop type. Controls output alignment and crop region.
        enum:
          - FACE_CUT_BASE
          - FACE_CUT_FULL_FRONTAL
          - FACE_CUT_TOKEN_FRONTAL
requires:
- image
- objects[].bbox
- objects[].keypoints
produces:
- objects[].cut_rect
- objects[].face_crop
prerequisites:
- FACE_DETECTOR
- FACE_TRACKING_MODULE
- FACE_FITTER
prerequisites_note: "OR: requires either FACE_DETECTOR or FACE_TRACKING_MODULE (not both)"
constraints:
  multiple_faces_supported: true
errors:
  - code: 0x18ba1f8e
    description: Unknown modification specified in block config
  - code: 0x032ad038
    description: onnxruntime library could not be loaded
see_also:
  api:
    - languages/python_api.yaml
    - languages/cpp_api.yaml
    - languages/java_api.yaml
    - languages/csharp_api.yaml
    - languages/flutter_api.yaml
