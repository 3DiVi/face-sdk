unit_type: EYE_OPENNESS_ESTIMATOR
description: Estimates eye openness for both eyes
confidence: explicit
gpu_supported: true
modifications:
  - name: light
    description: Lightweight eye openness estimation (default)
    versions:
    - version: 1
      parameters:
        openness_threshold:
          type: double
          required: false
          default: 0.5693
          description: Eye openness classification threshold (0-1)
          minimum: 0
          maximum: 1
requires:
- image
- objects[].bbox
- objects[].keypoints
produces:
- objects[].is_left_eye_open
- objects[].is_right_eye_open
prerequisites:
- FACE_DETECTOR
- FACE_TRACKING_MODULE
- FACE_FITTER
prerequisites_note: "OR: requires either FACE_DETECTOR or FACE_TRACKING_MODULE (not both)"
constraints:
  multiple_faces_supported: true
errors:
  - code: 0x18ba1f8e
    description: Unknown modification specified in block config
  - code: 0x54faacfe
    description: GPU device not available but use_cuda enabled
  - code: 0x78121b36
    description: Build does not support GPU
  - code: 0x032ad038
    description: onnxruntime library could not be loaded
see_also:
  api:
    - languages/python_api.yaml
    - languages/cpp_api.yaml
    - languages/java_api.yaml
    - languages/csharp_api.yaml
    - languages/flutter_api.yaml
