requires:
- image
- objects[].bbox
- objects[].keypoints
produces:
- objects[].liveness
prerequisites:
- FACE_DETECTOR
- FACE_TRACKING_MODULE
- FACE_FITTER
prerequisites_note: "OR: requires either FACE_DETECTOR or FACE_TRACKING_MODULE (not both)"
constraints:
  multiple_faces_supported: false
  objects_count:
    exact: 1
errors:
  - code: 0x18ba1f8e
    description: Unknown modification specified in block config
  - code: 0x54faacfe
    description: GPU device not available but use_cuda enabled
  - code: 0x78121b36
    description: Build does not support GPU
  - code: 0x032ad038
    description: onnxruntime library could not be loaded
  - code: MULTIPLE_FACES
    description: More than one face in objects[] — requires exactly 1 face per frame
see_also:
  examples:
